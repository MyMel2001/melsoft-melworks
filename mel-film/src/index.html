<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MelFilm - Professional Video Editing Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="mf-header">
    <div class="mf-brand">MelFilm</div>
    <div class="mf-actions">
      <button class="mf-btn" id="mf-btn-open" onclick="triggerOpen()">Open Video...</button>
      <button class="mf-btn" id="mf-btn-poster" onclick="capturePoster()">Capture Poster</button>
    </div>
  </header>

  <nav class="mf-tabs">
    <button class="mf-tab" id="mf-tab-edit" onclick="switchMfTab('edit')">Edit</button>
    <button class="mf-tab" id="mf-tab-render" onclick="switchMfTab('render')">Render</button>
    <button class="mf-tab" id="mf-tab-comps" onclick="switchMfTab('comps')">Comps</button>
  </nav>

  <main class="mf-workspace" id="mf-panel-edit">
    <video id="mf-video" class="mf-video" controls style="max-width: 90%; max-height: 70vh;"></video>
  </main>

  <main class="mf-workspace mf-hidden" id="mf-panel-render">
    <div class="mf-render-panel">
      <div class="mf-panel-title">Render</div>
      <label class="mf-field">Preset
        <select id="mf-preset" class="mf-select" onchange="updateMfPreset(this.value)">
          <option value="custom">Custom</option>
          <option value="4k-tv">4K TV</option>
          <option value="1080p-tv">1080p TV</option>
          <option value="youtube">YouTube</option>
        </select>
      </label>
      <label class="mf-field">Resolution
        <select id="mf-resolution" class="mf-select">
          <option value="1920x1080">1920x1080 (Full HD)</option>
          <option value="1280x720" selected>1280x720 (HD)</option>
          <option value="854x480">854x480 (SD)</option>
        </select>
      </label>
      <label class="mf-field">Format
        <select id="mf-format" class="mf-select">
          <option value="mp4" selected>MP4 (H.264)</option>
          <option value="webm">WebM (VP9)</option>
        </select>
      </label>
      <label class="mf-field">FPS
        <input type="number" id="mf-fps" value="30" min="1" max="240">
      </label>
      <button class="mf-btn" id="mf-btn-apply" onclick="exportVideo()">Start Render</button>
      <label class="mf-field">Transition
        <select id="mf-transition" class="mf-select" onchange="updateMfTransition(this.value)">
          <option value="none">None</option>
          <option value="fade">Fade</option>
          <option value="fadeblack">Fade to Black</option>
          <option value="fadewhite">Fade from White</option>
          <option value="slideleft">Slide Left</option>
          <option value="slideright">Slide Right</option>
          <option value="slideup">Slide Up</option>
          <option value="slidedown">Slide Down</option>
          <option value="zoompan">Zoom</option>
        </select>
      </label>
      <label class="mf-field">Transition Duration
        <input type="number" id="mf-transition-duration" class="mf-num" min="0" max="10" step="0.1" value="1">
      </label>
      <button class="mf-btn" id="mf-btn-crossfade" onclick="crossfadeMfLayers()">Crossfade Layers</button>
      <label class="mf-field">Bundle Format
        <select id="mf-bundle-format" class="mf-select">
          <option value="aepx">AE Project (.aepx)</option>
          <option value="prproj">PR Project (.prproj)</option>
        </select>
      </label>
      <label class="mf-field">Bundle Name
        <input type="text" id="mf-bundle-name" value="" placeholder="Project name">
      </label>
      <button class="mf-btn" id="mf-btn-save-bundle" onclick="saveMfBundle()">Save Bundle...</button>
      <input type="file" id="mf-bundle-input" accept="application/zip,.zip" style="display:none" onchange="loadMfBundle(event)">
      <div class="mf-status" id="mf-status">MelFilm | No video open</div>
    </div>
  </main>

  <main class="mf-workspace mf-hidden" id="mf-panel-comps">
    <div class="mf-comp-panel">
      <div class="mf-panel-title">Composition</div>
      <div class="mf-comp-name" id="mf-comp-name">Comp</div>
      <button class="mf-btn" id="mf-btn-add-comp" onclick="createMfComp()">New Comp</button>
      <button class="mf-btn" id="mf-btn-add-layer" onclick="addMfLayer()">Add Layer</button>
      <button class="mf-btn" id="mf-btn-add-layer-src" onclick="document.getElementById('mf-layer-src-input').click()">Add Layer from Media...</button>
      <div class="mf-layer-list" id="mf-layer-list">No layers in comp.</div>
      <input type="file" id="mf-layer-src-input" accept="video/*,audio/*,image/*" style="display:none" onchange="onMfLayerSource(event)">

      <div class="mf-panel-title">Layer Tween</div>
      <label class="mf-field">Layer
        <select id="mf-tween-layer" class="mf-select" onchange="selectMfTweenLayer(this.value)">
          <option value="">No layers</option>
        </select>
      </label>
      <label class="mf-field">Scrub
        <input type="range" id="mf-tween-frame" class="mf-scrub" min="0" max="60" value="0" oninput="setMfTweenFrame(this.value)">
        <span id="mf-tween-time" class="mf-tween-time">f 0 | 0.00s</span>
      </label>
      <label class="mf-field">Easing
        <select id="mf-tween-easing" class="mf-select">
          <option value="linear">Linear</option>
          <option value="easeIn">Ease In</option>
          <option value="easeOut">Ease Out</option>
          <option value="easeInOut" selected>Ease In/Out</option>
          <option value="bounceOut">Bounce Out</option>
        </select>
      </label>
      <div class="mf-tween-grid">
        <label class="mf-field">X <input type="number" id="mf-tween-x" class="mf-num" step="1" value="0"></label>
        <label class="mf-field">Y <input type="number" id="mf-tween-y" class="mf-num" step="1" value="0"></label>
        <label class="mf-field">Scale <input type="number" id="mf-tween-scale" class="mf-num" step="0.01" value="1"></label>
        <label class="mf-field">Rotation <input type="number" id="mf-tween-rotation" class="mf-num" step="1" value="0"></label>
        <label class="mf-field">Opacity <input type="number" id="mf-tween-opacity" class="mf-num" step="0.01" min="0" max="1" value="1"></label>
      </div>
      <div class="mf-tween-actions">
        <button class="mf-btn" id="mf-btn-add-keyframe" onclick="addMfKeyframe()">Add Keyframe</button>
        <button class="mf-btn" id="mf-btn-del-keyframe" onclick="deleteMfKeyframe()">Delete Keyframe</button>
        <button class="mf-btn" id="mf-btn-render-tween" onclick="renderMfTween()">Render Tween</button>
      </div>
      <div class="mf-keyframe-list" id="mf-keyframe-list"></div>
      <canvas id="mf-tween-canvas" class="mf-tween-canvas" width="640" height="360"></canvas>
    </div>
  </main>

  <input type="file" id="mf-file-input" accept="video/*" style="display:none" onchange="handleVideoFile(event)">

  <script src="app.js"></script>
</body>
</html>
