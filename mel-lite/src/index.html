<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MelLite - Professional Photo Development Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="ml-header">
    <div class="ml-brand">MelLite</div>
    <div class="ml-actions">
      <button class="ml-btn" id="ml-btn-open" onclick="triggerOpen()">Open Image...</button>
      <button class="ml-btn" id="ml-btn-save-project" onclick="saveProject()">Save Project...</button>
      <button class="ml-btn" id="ml-btn-export" onclick="exportStandardImage()">Export Image</button>
      <button class="ml-btn" id="ml-btn-import-raw" onclick="document.getElementById('ml-raw-input').click()">Import RAW</button>
    </div>
  </header>

  <main class="ml-workspace">
    <canvas id="ml-canvas" class="ml-canvas"></canvas>
  </main>

  <aside class="ml-panel">
    <div class="ml-panel-title">Develop</div>
    <label class="ml-slider-row">Exposure (EV)
      <input type="range" id="ml-exp" min="-5" max="5" step="0.1" value="0" oninput="updateExposure(this.value)">
      <span id="ml-exp-val">0.0</span>
    </label>
    <label class="ml-slider-row">Contrast
      <input type="range" id="ml-contrast" min="0" max="255" value="0" oninput="updateContrast(this.value)">
      <span id="ml-contrast-val">0</span>
    </label>
    <label class="ml-slider-row">Brightness
      <input type="range" id="ml-brightness" min="-100" max="100" value="0" oninput="updateBrightness(this.value)">
      <span id="ml-brightness-val">0</span>
    </label>
    <label class="ml-slider-row">Saturation
      <input type="range" id="ml-saturation" min="0" max="200" value="100" oninput="updateSaturation(this.value)">
      <span id="ml-saturation-val">100%</span>
    </label>
    <div class="ml-wb-row">White Balance
      <label>R <input type="number" id="ml-wb-r" value="1.0" step="0.01" min="0.1" max="3" oninput="updateWhiteBalance()"></label>
      <label>G <input type="number" id="ml-wb-g" value="1.0" step="0.01" min="0.1" max="3" oninput="updateWhiteBalance()"></label>
      <label>B <input type="number" id="ml-wb-b" value="1.0" step="0.01" min="0.1" max="3" oninput="updateWhiteBalance()"></label>
    </div>
    <div class="ml-crop-row">Crop
      <label>X <input type="number" id="ml-crop-x" value="0" oninput="updateCropX(this.value)"></label>
      <label>Y <input type="number" id="ml-crop-y" value="0" oninput="updateCropY(this.value)"></label>
      <label>W <input type="number" id="ml-crop-w" value="" oninput="updateCropW(this.value)"></label>
      <label>H <input type="number" id="ml-crop-h" value="" oninput="updateCropH(this.value)"></label>
      <button class="ml-btn" id="ml-btn-crop" onclick="applyCropNow()">Apply Crop</button>
    </div>
    <label class="ml-slider-row">Rotate
      <select id="ml-rotate" onchange="updateRotate(this.value)">
        <option value="0">0°</option>
        <option value="90">90°</option>
        <option value="180">180°</option>
        <option value="270">270°</option>
      </select>
    </label>
    <label class="ml-slider-row">Sharpen
      <input type="range" id="ml-sharpen" min="0" max="5" step="0.1" value="0" oninput="updateSharpen(this.value)">
      <span id="ml-sharpen-val">0</span>
    </label>
    <div class="ml-brush-row">Local Adjust (Brush)
      <label>Size
        <input type="range" id="ml-brush-size" min="1" max="200" step="1" value="20" oninput="updateBrushSize(this.value)">
        <span id="ml-brush-size-val">20</span>
      </label>
      <button class="ml-btn" id="ml-btn-local" onclick="applyLocalNow()">Apply Local</button>
    </div>
    <button class="ml-btn" id="ml-btn-reset" onclick="resetAdjustments()">Reset Adjustments</button>
    <button class="ml-btn" id="ml-btn-preview" onclick="previewAdjustments()">Preview Adjustments</button>
    <button class="ml-btn" id="ml-btn-apply" onclick="applyAdjustments()">Apply Adjustments</button>
    <div class="ml-status" id="ml-status">MelLite | No image open</div>
  </aside>

  <label class="ml-slider-row">Export Format
    <select id="ml-export-format" class="ml-select">
      <option value="png">PNG</option>
      <option value="jpeg">JPEG</option>
      <option value="webp">WEBP</option>
    </select>
  </label>

  <input type="file" id="ml-file-input" accept="image/*" style="display:none" onchange="handleImageFile(event)">

  <input type="file" id="ml-raw-input" accept=".dng,image/dng" style="display:none" onchange="importRawDng(event)">

  <input type="file" id="ml-project-input" accept="application/json,.json" style="display:none" onchange="loadProject(event)">

  <script src="app.js"></script>
</body>
</html>
