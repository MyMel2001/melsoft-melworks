<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MelSound - Professional Music Production Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="ms-header">
    <div class="ms-brand">MelSound</div>
    <div class="ms-actions">
      <button class="ms-btn" id="ms-btn-new" onclick="newProject()">New Project</button>
      <button class="ms-btn" id="ms-btn-open" onclick="triggerOpen()">Open Project...</button>
      <button class="ms-btn" id="ms-btn-save" onclick="saveProject()">Save Project</button>
      <button class="ms-btn" id="ms-btn-play" onclick="playSequence()">Play</button>
      <button class="ms-btn" id="ms-btn-stop" onclick="stopSequence()">Stop</button>
    </div>
  </header>

  <main class="ms-workspace">
    <div class="ms-project-info">
      <div class="ms-field">BPM <input type="number" id="ms-bpm" value="120" min="1" max="999" oninput="updateBpm(this.value)"></div>
      <div class="ms-field">Master Gain <input type="number" id="ms-gain" value="1" min="0" max="10" step="0.01" oninput="updateGain(this.value)"></div>
      <button class="ms-btn" id="ms-btn-add-track" onclick="addTrack()">Add Track</button>
      <button class="ms-btn" id="ms-btn-remove-track" onclick="removeTrack()">Remove Track</button>
      <button class="ms-btn" id="ms-btn-save-flp" onclick="saveFls()">Save FLP</button>
      <input type="file" id="ms-flp-input" accept=".flp,application/octet-stream" style="display:none" onchange="openFls(event)">
      <div class="ms-status" id="ms-status">MelSound | No project open</div>
    </div>
  </main>

  <input type="file" id="ms-file-input" accept="application/json,.json" style="display:none" onchange="handleProjectFile(event)">

  <script src="app.js"></script>
</body>
</html>
